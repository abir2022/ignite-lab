<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/><stop offset="55%" stop-color="#0d1424"/><stop offset="100%" stop-color="#121b30"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb923c"/><stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="54"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <style>
      text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
      .blob{animation:drift 14s ease-in-out infinite alternate}
      .b2{animation-duration:19s;animation-direction:alternate-reverse}
      .title{animation:rise .85s cubic-bezier(.2,.7,.3,1) both}
      .sub{animation:rise .85s .15s cubic-bezier(.2,.7,.3,1) both}
      .rule{animation:sweep 1.1s .3s cubic-bezier(.2,.7,.3,1) both;transform-box:fill-box;transform-origin:left center}
      .dot{animation:pulse 2.6s ease-in-out infinite}
      @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
      @keyframes sweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      @keyframes drift{from{transform:translate(0,0)}to{transform:translate(52px,-28px)}}
      @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
      @media (prefers-reduced-motion: reduce){.blob,.title,.sub,.rule,.dot{animation:none!important;opacity:1!important}}
    </style>
  </defs>
  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect width="1280" height="300" fill="url(#grid)"/>
  <g class="blob" filter="url(#soft)" opacity="0.5"><circle cx="250" cy="70" r="125" fill="#fb923c"/></g>
  <g class="blob b2" filter="url(#soft)" opacity="0.42"><circle cx="1050" cy="235" r="145" fill="#f43f5e"/></g>
  <g class="title"><text x="72" y="136" font-size="52" font-weight="700" fill="#ffffff">Ignite Lab</text></g>
  <g class="sub"><text x="74" y="186" font-size="23" fill="#9fb0cc">a virtual training lab for hands-on courses</text></g>
  <rect class="rule" x="72" y="208" width="236" height="6" rx="3" fill="url(#ac)"/>
  <circle class="dot" cx="336" cy="211" r="5" fill="#f43f5e"/>
</svg>